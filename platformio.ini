[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-83340
board_build.partitions = partitions.csv
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TOUCH_CS=33
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000
build_src_filter = +<*> -<display_probe.cpp>

[env:displaydiag]
extends = env:esp32dev
build_src_filter =
  +<display_probe.cpp>
  -<arduino_main.cpp>
